# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# If a tool is renamed, keep the name synchronized across:
#   this file -> tools/__init__.py -> data/eval_base.json
#   -> data/eval_helpdesk_extension.json -> report/demo text
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi câu hỏi cho người dùng để làm rõ khi thiếu thông tin (mã máy, mã nhân viên), khi môi trường không rõ ràng giữa production/staging, hoặc xin xác nhận trước khi thực hiện hành động ghi (tạo ticket)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi cần gửi cho người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời: 'text' khi cần bổ sung thông tin tự do (mã máy, mã nhân viên); 'yes_no' khi xin xác nhận trước khi tạo ticket; 'choice' khi cần chọn giữa các lựa chọn cố định (ví dụ chọn production hoặc staging)"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách các lựa chọn khi response_type là 'choice' (ví dụ ['production', 'staging'])"}
      required: [question]

  - name: search_kb
    description: "Tìm kiếm hướng dẫn hỗ trợ kỹ thuật trong Knowledge Base. Bắt buộc chọn đúng category chuyên biệt tương ứng với chủ đề (Outlook/webmail -> email; VPN/certificate -> vpn; mạng không dây -> wifi; in ấn -> printing). Chỉ dùng 'all' khi chủ đề hoàn toàn chung chung."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn cụ thể. Bắt buộc chọn đúng nhóm chuyên biệt: 'email' cho Outlook/mail/hộp thư, 'vpn' cho VPN, 'wifi' cho mạng Wi-Fi, v.v. Không để 'all' khi đã xác định được dịch vụ."}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái của một dịch vụ dùng chung. Chỉ hỗ trợ 2 môi trường hợp lệ: 'production' và 'staging'. Khi người dùng nói rõ production hoặc staging, gọi trực tiếp tool này. Chỉ gọi 'clarify' khi môi trường không rõ hoặc là môi trường lạ (như demo, QA, test, dev)."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường dịch vụ: 'production' hoặc 'staging'. Dùng trực tiếp khi người dùng đã nêu rõ. Nếu người dùng nhắc đến môi trường lạ/không xác định (như demo, test, QA), cấm tự đoán, phải dùng clarify để hỏi người dùng."}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin và chẩn đoán thiết bị."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản"}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Nhóm kiểm tra"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu người dùng trong danh bạ hỗ trợ."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên"}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Đã được người dùng xác nhận"}
      required: [summary]
  - name: lookup_ticket_status
    description: "Tra cứu tiến độ, mức độ ưu tiên và tình trạng xử lý của một ticket hỗ trợ IT đã có theo mã ticket_id (định dạng LAB-XXXXXXXX). Không dùng để tạo ticket mới."
    parameters:
      type: object
      properties:
        ticket_id:
          type: string
          description: "Mã định danh của ticket cần tra cứu, theo định dạng chuẩn LAB-XXXXXXXX (ví dụ: LAB-9B1D2E4F)."
      required: [ticket_id]

